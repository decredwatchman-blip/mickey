
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$MICKEY — fireworks night</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4dc;--mute:#c9c3d6;--gold:#ffd34d;--red:#ff2a1f;--night:#0a0e2a;--card:rgba(10,14,42,.62);--line:rgba(255,211,77,.28);
--f1:'Baloo 2','Trebuchet MS',sans-serif;--f2:'Nunito','Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f2);line-height:1.55}
/* fixed scene stack */
.scene{position:fixed;inset:0;opacity:0;transition:opacity 1.4s ease;z-index:-3}
.scene.on{opacity:1}
.s1{background:linear-gradient(#141a55 0%,#5a3a9a 48%,#ff8a5c 88%,#ffd08a 100%)}
.s2{background:linear-gradient(#01020c 0%,#06133d 55%,#0c3a6b 100%)}
.s3{background:linear-gradient(#0a0220 0%,#3b0f5c 55%,#c2306e 118%)}
.s4{background:linear-gradient(#12062a 0%,#7a2a2a 55%,#ffb347 115%)}
.moon{position:fixed;top:9vh;right:10vw;width:70px;height:70px;border-radius:50%;background:#fff6d8;box-shadow:0 0 60px 20px rgba(255,246,216,.35);z-index:-3;opacity:0;transition:opacity 1.4s}
body[data-s="2"] .moon{opacity:1}
.castle{position:fixed;left:0;right:0;bottom:0;width:100%;height:42vh;z-index:-2;transition:opacity 1.4s,filter 1.4s}
body[data-s="1"] .castle{opacity:.85;filter:brightness(.35) saturate(1.4)}
body[data-s="2"] .castle{opacity:.9;filter:brightness(.25)}
body[data-s="3"] .castle{opacity:.5;filter:brightness(.2)}
body[data-s="4"] .castle{opacity:.8;filter:brightness(.18)}
.veil{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 45%,rgba(5,8,24,.55),rgba(5,8,24,.15) 70%)}
.curtain{position:fixed;top:0;bottom:0;width:9vw;z-index:-1;background:repeating-linear-gradient(90deg,#16226b 0 14px,#0d1647 14px 28px);opacity:.55}
.curtain.l{left:0;border-right:2px solid var(--gold)}.curtain.r{right:0;border-left:2px solid var(--gold)}
/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:18px;padding:10px 4vw;background:rgba(10,14,42,.78);backdrop-filter:blur(8px);z-index:10}
nav img{width:38px;height:38px;border-radius:50%}
nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
nav .sp{flex:1}
.btn{display:inline-block;background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;padding:10px 22px;font:800 16px var(--f1);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:700px){nav a.h{display:none}}
/* sections */
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:90px 14vw;max-width:1200px;margin:0 auto}
h1,h2{font-family:var(--f1);font-weight:800;line-height:1.02;margin:0 0 .4em;text-shadow:0 4px 24px rgba(0,0,0,.5)}
h1{font-size:clamp(3rem,9vw,7rem)}h2{font-size:clamp(2.2rem,6vw,4.6rem)}
em{font-style:normal;color:var(--gold)}
p.lead{font-size:1.15rem;max-width:56ch;color:var(--mute)}
.hero{align-items:flex-start}
.hero img.logo{width:min(46vw,260px);border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 8px var(--red),0 20px 60px rgba(0,0,0,.5);margin-bottom:28px;animation:rise 1.2s ease both}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.addr{margin-top:22px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:13px;word-break:break-all;max-width:620px}
.addr button,.addr a{flex:none;padding:8px 16px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.card b{display:block;font:800 1.5rem var(--f1);color:var(--gold)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px;padding:0;list-style:none}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.steps li:before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--red);font:800 18px var(--f1);margin-bottom:10px}
.steps h3{margin:0 0 4px;font:800 1.25rem var(--f1)}.steps p{margin:0;color:var(--mute);font-size:.95rem}
.wallet{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;max-width:620px}
.wallet input{flex:1;min-width:200px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
#out{margin-top:12px;color:var(--gold);min-height:1.5em}
footer{padding:40px 14vw 60px;text-align:center;color:var(--mute);font-size:.85rem;max-width:760px;margin:0 auto}
footer img{width:90px;border-radius:50%;margin-bottom:12px}
@media(max-width:700px){section{padding:90px 7vw}.curtain{display:none}}
@media(prefers-reduced-motion:reduce){.scene,.castle,.moon{transition:none}.hero img.logo{animation:none}html{scroll-behavior:auto}}
